<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jevtabtidy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="" width="40" height="40" />
    <div>
      <h1>Jevtabtidy</h1>
      <p class="tagline">Jev keeps your tabs tidy</p>
    </div>
  </header>

  <p id="state" class="state"></p>
  <p id="dry" class="state warn" hidden>
    Dry run is on: tabs are only logged, nothing is closed.
    <button type="button" id="dryoff" class="link">Turn off</button>
  </p>

  <section id="gate" class="card">
    <label>API key
      <input type="password" id="key" autocomplete="off" spellcheck="false" placeholder="Paste your key" />
    </label>
    <button type="button" id="activate" class="primary">Activate</button>
  </section>

  <section id="active" class="card" hidden>
    <div class="keyrow">
      <span>Key <code id="masked"></code></span>
      <button type="button" id="remove" class="link">Remove</button>
    </div>
    <button type="button" id="run" class="primary">Tidy now</button>
  </section>

  <p id="last" class="muted"></p>

  <button type="button" id="undo" class="btn">Undo last close</button>
  <a class="btn" href="../history/history.html" target="_blank" id="history">Open closed-tabs history</a>
  <p class="links"><a href="#" id="options">Settings</a></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
