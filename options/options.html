<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jevtabtidy</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1>Jevtabtidy</h1>
  <p id="status" class="muted">Loading…</p>

  <form id="form">
    <label>Run every (min) <input type="number" id="intervalMinutes" min="5" /></label>
    <label>Collapse idle groups after (min) <input type="number" id="collapseAfterMin" min="1" /></label>
    <label>Close forgotten tabs after (min) <input type="number" id="forgottenAfterMin" min="1" /></label>
    <label>Never close the last N used tabs <input type="number" id="keepRecent" min="1" /></label>
    <label>Group a category only when it has at least N tabs <input type="number" id="minGroupSize" min="1" /></label>
    <label>With Jev: close untouched ungrouped tabs after (hours) <input type="number" id="idleCloseHours" min="1" /></label>
    <label>Treat a tab as live if it changed in the background within (hours) <input type="number" id="liveWindowHours" min="1" /></label>
    <label>Close other ungrouped tabs after (min) <input type="number" id="staleAfterMin" min="5" /></label>

    <label>Jev key-check URL (called once on Activate)
      <input type="url" id="verifyUrl" placeholder="https://api.typesafe.ai/v1/systemone" />
    </label>
    <label>Jev decision URL
      <input type="url" id="decideUrl" placeholder="https://api.typesafe.ai/v1/systemone" />
    </label>
    <label>Guidance for Jev (plain language: what to keep, close and group)
      <textarea id="policy" rows="6"></textarea>
    </label>
    <label>Fallback rules, used only if Jev is off or unreachable: work services (JSON: name, color, patterns)
      <textarea id="services" rows="12" spellcheck="false"></textarea>
    </label>
    <label>Forgotten patterns (one per line)
      <textarea id="forgotten" rows="8" spellcheck="false"></textarea>
    </label>

    <div class="row">
      <button type="submit">Save</button>
      <button type="button" id="reset">Reset defaults</button>
      <button type="button" id="run">Tidy now</button>
    </div>
    <p id="error" class="error"></p>
  </form>

  <p><a href="../history/history.html" target="_blank">Open full closed-tabs history →</a></p>
  <h2 id="log">Activity log <small id="logCounts" class="muted"></small>
    <select id="logLevel">
      <option value="info">All</option>
      <option value="warn">Warnings + errors</option>
      <option value="error">Errors only</option>
    </select>
    <button type="button" id="logRefresh">Refresh</button>
    <button type="button" id="logCopy">Copy</button>
    <button type="button" id="logClear">Clear</button>
  </h2>
  <pre id="activity" class="activity"></pre>

  <h2>Closed tabs <button type="button" id="clearLog">Clear</button></h2>
  <table>
    <thead><tr><th>When</th><th>Tab</th><th>Why</th><th></th></tr></thead>
    <tbody id="log"></tbody>
  </table>

  <script type="module" src="options.js"></script>
</body>
</html>
